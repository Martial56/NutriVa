{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">📊 Tableau de bord - NutriVa</h2>
    <!-- Menu de sélection du mois -->
    <form method="GET" class="mb-4">
    <div class="row">
        <div class="col-md-4">
            <select name="month" class="form-select" onchange="this.form.submit()">
                <option value="">— Choisir un mois —</option>

                <option value="1">Janvier</option>
                <option value="2">Février</option>
                <option value="3">Mars</option>
                <option value="4">Avril</option>
                <option value="5">Mai</option>
                <option value="6">Juin</option>
                <option value="7">Juillet</option>
                <option value="8">Août</option>
                <option value="9">Septembre</option>
                <option value="10">Octobre</option>
                <option value="11">Novembre</option>
                <option value="12">Décembre</option>
            </select>
        </div>
    </div>
    </form>


    <!-- KPIs -->
    <div class="row">

        <div class="col-md-3">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Patients</h5>
                    <h3>{{ total_patients }}</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Nouveaux (ce mois)</h5>
                    <h3>{{ this_month_patients }}</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-warning mb-3">
                <div class="card-body">
                    <h5 class="card-title">Vaccinations</h5>
                    <h3>{{ total_vaccins }}</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-danger mb-3">
                <div class="card-body">
                    <h5 class="card-title">Cas positifs</h5>
                    <h3>{{ cas_positifs }}</h3>
                </div>
            </div>
        </div>

    </div>

    <!-- Graphiques -->
    <div class="row mt-4">

        <div class="col-md-6">
            <canvas id="sexChart"></canvas>
        </div>

        <div class="col-md-6">
            <canvas id="produitsChart"></canvas>
        </div>

    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <canvas id="visitesChart"></canvas>
        </div>
    </div>

</div>


<script>
    // Sexe chart
    const sexeData = {
        labels: [{% for s in sexe_stats %}'{{ s.sexe }}',{% endfor %}],
        datasets: [{
            data: [{% for s in sexe_stats %}{{ s.total }},{% endfor %}],
            backgroundColor: ['#36A2EB', '#FF6384'],
        }]
    };
    new Chart(document.getElementById('sexChart'), {
        type: 'pie',
        data: sexeData
    });

    // Produits chart
    const produitsLabels = ['Lait','Plumpy','Déparasitant','Vit A100','Vit A200'];
    const produitsValues = [
        {{ produits_totaux.lait }},
        {{ produits_totaux.plumpy }},
        {{ produits_totaux.deparasitant }},
        {{ produits_totaux.vitA100 }},
        {{ produits_totaux.vitA200 }},
    ];

    new Chart(document.getElementById('produitsChart'), {
        type: 'bar',
        data: {
            labels: produitsLabels,
            datasets: [{
                label: "Produits distribués",
                data: produitsValues
            }]
        }
    });

    // Visites mensuelles chart
    const visitesLabels = [{% for v in visites_mensuelles %}'{{ v.month|date:"M Y" }}',{% endfor %}];
    const visitesValues = [{% for v in visites_mensuelles %}{{ v.total }},{% endfor %}];

    new Chart(document.getElementById('visitesChart'), {
        type: 'line',
        data: {
            labels: visitesLabels,
            datasets: [{
                label: "Visites par mois",
                data: visitesValues,
                tension: 0.4
            }]
        }
    });

</script>

</body>
</html>
