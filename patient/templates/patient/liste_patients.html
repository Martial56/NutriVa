<!DOCTYPE html>
<html lang="fr">
{% load static %}
{% load patient_extras %}
<head>
    <meta charset="UTF-8">
    <title>Patients – Vue Kanban</title>

    <!-- Styles -->
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'patient/style.css' %}">
</head>
<body class="liste_body">
    {% include 'patient/header.html' %}
    <!-- Barre de navigation -->
    <nav class="header-bar-liste"> <!--navbar bg-light mb-4 px-3-->
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <!-- Recherche -->
            <form class="d-flex w-50" method="get" action="{% url 'rechercher_patients' %}">
                {% csrf_token %}
                <input type="search" name="search" class="form-control me-2" placeholder="Rechercher un patient…" aria-label="Recherche"value="{{ query|default:'' }}">
                <button class="btnrecherche" type="submit">Rechercher</button>
            </form>

            <!-- Icônes -->
            <div class="d-flex align-items-center">
                <a href="{% url 'creer_patient' %}">
                    <img src="{% static 'images/ajouter.png' %}" class="icon-img" alt="Ajouter" title="Nouveau patient" style="color:white">
                </a>
                
            </div>
        </div>
    </nav>

    <!-- Grid Kanban -->
    <div class="container-fluid px-3 pt-3">
        <div id="patients-grid">
            {% include 'patient/_patient_grid.html' %}
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const searchInput = document.querySelector('input[name="search"]');
            const searchForm = searchInput.closest('form');
            const grid = document.getElementById('patients-grid');
            const rechercherURL = "{% url 'rechercher_patients' %}";

            let debounceTimer = null;
            let activeRequest = null;

            function lancerRecherche(query) {
                if (activeRequest) {
                    activeRequest.abort();
                }

                const controller = new AbortController();
                activeRequest = controller;

                fetch(`${rechercherURL}?search=${encodeURIComponent(query)}`, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    signal: controller.signal
                })
                    .then(response => response.text())
                    .then(html => {
                        grid.innerHTML = html;
                    })
                    .catch(error => {
                        if (error.name !== 'AbortError') {
                            console.error('Erreur lors de la recherche :', error);
                        }
                    });
            }

            searchInput.addEventListener('input', function () {
                clearTimeout(debounceTimer);
                const query = this.value.trim();
                debounceTimer = setTimeout(() => lancerRecherche(query), 300);
            });

            // Empêche le rechargement de la page si l'utilisateur valide le formulaire (Entrée / bouton)
            searchForm.addEventListener('submit', function (event) {
                event.preventDefault();
                clearTimeout(debounceTimer);
                lancerRecherche(searchInput.value.trim());
            });
        });
    </script>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
