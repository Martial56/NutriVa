<!DOCTYPE html>
<html lang="fr">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="{% static 'patient/style.css' %}">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="login-box">
            <h1 class="title">Connectez-vous</h1>

            <form method="POST">
                {% csrf_token %}

                {% if form.errors %}
                    <p style="color:red; text-align:center;">Nom d’utilisateur ou mot de passe incorrect.</p>
                {% endif %}

                <div class="input-group">
                    <input class="input_login" type="text" name="username" placeholder="Nom d'utilisateur" required>
                    <input class="input_login" type="password" name="password" placeholder="Mot de passe" required>
                </div>

                <button type="submit" class="btn-login">Se connecter</button>
            </form>

            <p class="forgot-password">
                <a href="#">Mot de passe oublié</a>
            </p>

            <p class="no-account">
                Pas de compte ?
                <a href="#" class="btn-register">S'inscrire ici</a>
            </p>
        </div>
    </div>

</body>
</html>
