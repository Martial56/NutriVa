<!doctype html>
<html lang="fr">    
{% load static %}   
<head>    
    <meta charset="UTF-8">    
    <title>menu</title>    

    <!-- Styles -->
     <style>
    #backup-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 9999;
        justify-content: center;
        align-items: center;
    }
    #backup-overlay.active { display: flex; }
    #backup-box {
        background: #fff;
        border-radius: 12px;
        padding: 32px 40px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    #backup-box p { margin: 12px 0 0; font-family: Arial; font-size: 15px; color: #333; }
    .spinner {
        width: 44px; height: 44px;
        border: 5px solid #e0e0e0;
        border-top-color: #0066cc;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="stylesheet" href="{% static 'patient/style.css' %}">    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>    
<body class="liste_body">   
 <!-- Header -->
 <header class="bg-light shadow-sm">
    <nav class="navbar-container">
        
        <!-- LOGO -->
        <div class="logo">
            <a href="{% url 'index' %}">
                <img src="{% static 'images/logo_NutriVa1.png' %}" alt="NutriVa">
            </a>
        </div>

        <!-- MENU PRINCIPAL -->
        <ul class="menu">
            <li><a href="{% url 'index' %}">Accueil</a></li>

            <li><a href="{% url 'liste_patients' %}">Patients</a></li>
            <li><a href="{% url 'rdv' %}">Rendez-vous</a></li>

            <li><a href="{% url 'dashboard' %}">Tableau de Bord</a></li>

            <!-- MENUS AVEC SOUS-MENUS -->
            <li class="has-dropdown">
                <a href="{% url 'rapport' %}">Rapports ▾</a>
                <!--<ul class="dropdown">
                    <li><a href="#">Rapport Vaccination</a></li>
                    <li><a href="#">Rapport Nutrition</a></li>
                    <li><a href="#">Rapport VIH</a></li>
                </ul>-->
            </li>

            <!-- MENU COMPTE AVEC SOUS-MENU -->
            <li class="has-dropdown dropdown-end">
                <a href="#">
                    <i class="bi bi-person-circle me-1"></i>  {{ user.username }} ▾
                </a>
                <ul class="dropdown">
                    <li><a href="{% url 'admin:index' %}">Paramètres</a></li>
                    <li><a href="#">Aide & Support</a></li>
                    <li>
                        <a href="{% url 'backup' %}" id="backup-link" onclick="startBackup(event)">
                            Backup
                        </a>
                    </li>
                    <li><hr></li>
                    <li>
                        <form method="POST" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="logout-btn">
                                Déconnexion
                            </button>
                        </form>
                    </li>
                </ul>
            </li>
        </ul>

        <!-- BOUTON CONNEXION 
        <a href="{% url 'login' %}" class="btn_connexion">Se connecter</a>-->

    </nav>
</header>


</body>
</html>
